name: Value Betting Analyzer

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: vba-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decidir qué hacer
        id: modo
        run: |
          MODO=nada
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODO=analizar
          elif [ "${{ github.event.schedule }}" = "*/5 * * * *" ]; then
            MODO=escuchar
          elif [ "$(TZ=Europe/Madrid date +%H)" = "09" ]; then
            MODO=analizar
          fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.modo.outputs.modo != 'nada'

      - uses: actions/setup-python@v5
        if: steps.modo.outputs.modo != 'nada'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.modo.outputs.modo != 'nada'
        run: pip install -r requirements.txt

      - name: Análisis diario o manual
        if: steps.modo.outputs.modo == 'analizar'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python value_betting_analyzer.py

      - name: Escuchar comando de Telegram
        if: steps.modo.outputs.modo == 'escuchar'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python escuchar_telegram.py
